<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">context-preflight Architecture</title>
  <desc id="desc">Workflow diagram showing discovery of AI agent context layers, five rule engines, and multiple output formats including CLI, Markdown PR comments, SARIF 2.1.0, GitHub Action, and MCP stdio server.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <style>
      .h1 { font: 700 20px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .sub { font: 500 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
      .cardTitle { font: 700 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .item { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
      .pillText { font: 700 11px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#bg)"/>
  <rect x="24" y="20" width="912" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="34" y="30" width="166" height="26" rx="6" fill="url(#accent)"/>
  <text x="117" y="47" text-anchor="middle" class="pillText">ZERO RUNTIME DEPS</text>
  <text x="216" y="49" class="h1">context-preflight</text>
  <text x="410" y="48" class="sub">Static + live preflight CI linter for AI coding-agent context layers</text>

  <!-- Column 1: Discovery -->
  <rect x="24" y="88" width="256" height="306" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="114" class="cardTitle">1. Context Discovery</text>
  <text x="42" y="133" class="sub">Repo scan + .gitignore aware</text>

  <rect x="40" y="148" width="224" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="52" y="167" class="item">CLAUDE.md / AGENTS.md</text>
  <text x="52" y="183" class="sub">@imports + subpackage scopes</text>

  <rect x="40" y="202" width="224" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="52" y="221" class="item">SKILL.md / .cursor / Copilot</text>
  <text x="52" y="237" class="sub">YAML frontmatter &amp; body lines</text>

  <rect x="40" y="256" width="224" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="52" y="275" class="item">.mcp.json + MCP Fixtures</text>
  <text x="52" y="291" class="sub">tools/list &amp; CallToolResult</text>

  <rect x="40" y="310" width="224" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="52" y="329" class="item">package.json / uv / Make</text>
  <text x="52" y="345" class="sub">Scripts, lockfiles &amp; LLM cache</text>

  <!-- Arrows 1 -> 2 -->
  <line x1="280" y1="240" x2="332" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2: Rule Engines -->
  <rect x="336" y="88" width="292" height="306" rx="12" fill="#0b1220" stroke="#6366f1" stroke-width="1.5"/>
  <text x="354" y="114" class="cardTitle">2. Preflight Rule Engines</text>
  <text x="354" y="133" class="sub">27 rules across 5 categories</text>

  <rect x="352" y="148" width="260" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="364" y="166" class="item">Security &amp; Injection</text>
  <text x="364" y="182" class="sub">Unicode bidi/tags, secrets, Bash(*)</text>

  <rect x="352" y="198" width="260" height="42" rx="8" fill="#172033" stroke="#3b82f6"/>
  <text x="364" y="216" class="item">Dead Refs &amp; Script Drift</text>
  <text x="364" y="232" class="sub">@imports, links, files, npm/pnpm/uv</text>

  <rect x="352" y="248" width="260" height="42" rx="8" fill="#172033" stroke="#10b981"/>
  <text x="364" y="266" class="item">Turn-0 Budget &amp; Skills</text>
  <text x="364" y="282" class="sub">Token accounting, overlap, frontmatter</text>

  <rect x="352" y="298" width="260" height="42" rx="8" fill="#172033" stroke="#f59e0b"/>
  <text x="364" y="316" class="item">Prompt Cache Hygiene</text>
  <text x="364" y="332" class="sub">Dynamic timestamps/UUIDs in prefix</text>

  <rect x="352" y="348" width="260" height="36" rx="8" fill="#172033" stroke="#a855f7"/>
  <text x="364" y="370" class="item">MCP Schema + Mirror Bloat</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="628" y1="240" x2="680" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 3: Reporters & Integrations -->
  <rect x="684" y="88" width="252" height="306" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="702" y="114" class="cardTitle">3. Gates &amp; Surfaces</text>
  <text x="702" y="133" class="sub">Score (0-100), Grade A-F &amp; Diffs</text>

  <rect x="700" y="148" width="220" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="712" y="167" class="item">npx context-preflight</text>
  <text x="712" y="183" class="sub">Text / JSON / Markdown CLI</text>

  <rect x="700" y="202" width="220" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="712" y="221" class="item">GitHub Action (node20)</text>
  <text x="712" y="237" class="sub">PR sticky comment + base diff</text>

  <rect x="700" y="256" width="220" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="712" y="275" class="item">SARIF 2.1.0 Export</text>
  <text x="712" y="291" class="sub">GitHub Code Scanning alerts</text>

  <rect x="700" y="310" width="220" height="44" rx="8" fill="#172033" stroke="#475569"/>
  <text x="712" y="329" class="item">context-preflight mcp</text>
  <text x="712" y="345" class="sub">Stdio MCP server + TS API</text>
</svg>
