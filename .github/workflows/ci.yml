name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed dist/action.js matches source
        if: matrix.node-version == 20
        run: git diff --exit-code dist/action.js

  preflight:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          fail-on: error
          comment-pr: "false"
          sarif-file: sarif-results.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: context-preflight-sarif
          path: sarif-results.sarif
